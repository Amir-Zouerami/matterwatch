services:
    matterwatch:
        build:
            context: .
            target: prod
        image: matterwatch:local
        init: true
        restart: unless-stopped
        env_file: .env
        ports:
            - '127.0.0.1:3000:3000' # put your reverse proxy in front; see docs/setup.md
        volumes:
            - matterwatch-data:/data
        mem_limit: 256m
        # Mattermost runs in another compose project? Join its network so MM_URL / SERVICE_URL can use service names:
        # networks: [default, mattermost]
        logging:
            driver: json-file
            options:
                max-size: 50m
                max-file: '3'

volumes:
    matterwatch-data:

# networks:
#     mattermost:
#         name: <the network your Mattermost container is on>
#         external: true
